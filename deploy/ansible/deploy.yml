---
- name: Развернуть цитатник на Linux-сервере
  hosts: all
  become: true
  vars:
    project_dir: /opt/smeshariki
    project_source: "{{ playbook_dir }}/../.."
    app_image: "{{ lookup('env', 'CI_REGISTRY_IMAGE') }}/app:{{ lookup('env', 'CI_COMMIT_SHA') }}"
    notification_image: "{{ lookup('env', 'CI_REGISTRY_IMAGE') }}/notification:{{ lookup('env', 'CI_COMMIT_SHA') }}"
    deploy_https: "{{ lookup('env', 'DEPLOY_HTTPS') | default('true', true) | lower }}"
    compose_command: "{{ ['docker', 'compose', '-f', 'compose.yaml', '-f', '../deploy/compose.images.yaml', '-f', '../deploy/compose.remote-server.yaml'] + (['-f', '../deploy/compose.https.yaml'] if deploy_https == 'true' else []) }}"
  pre_tasks:
    - name: Проверить обязательные настройки
      ansible.builtin.assert:
        that:
          - lookup('env', 'CI_REGISTRY') | length > 0
          - lookup('env', 'CI_REGISTRY_IMAGE') | length > 0
          - lookup('env', 'CI_COMMIT_SHA') | length > 0
          - lookup('env', 'REGISTRY_DEPLOY_USER') | length > 0
          - lookup('env', 'REGISTRY_DEPLOY_PASSWORD') | length > 0
          - deploy_https in ['true', 'false']
          - lookup('env', 'SITE_DOMAIN') is match('^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$')
          - lookup('env', 'POSTGRES_PASSWORD') is match('^[A-Za-z0-9_-]{32,}$')
        fail_msg: Проверь переменные Registry, SITE_DOMAIN и POSTGRES_PASSWORD в GitLab CI/CD.
      no_log: true
    - name: Установить Docker и Compose из репозитория Ubuntu
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, python3]
        state: present
        update_cache: true
    - name: Запустить Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
    - name: Проверить существующий volume базы
      ansible.builtin.command:
        argv: [docker, volume, inspect, berserk-quotes_quotes_data]
      register: existing_db_volume
      failed_when: false
      changed_when: false
    - name: Проверить существующий файл пароля
      ansible.builtin.stat:
        path: "{{ project_dir }}/KikoRiki-quotes/.secrets/postgres_password"
      register: existing_db_secret
    - name: Не менять пароль существующей базы автоматически
      ansible.builtin.assert:
        that:
          - existing_db_volume.rc != 0 or existing_db_secret.stat.exists
        fail_msg: На сервере уже есть volume базы без файла пароля. Сначала выполните миграцию пароля из deploy/README.md.
    - name: Прочитать существующий пароль
      ansible.builtin.slurp:
        src: "{{ project_dir }}/KikoRiki-quotes/.secrets/postgres_password"
      register: previous_db_secret
      when: existing_db_secret.stat.exists
      no_log: true
    - name: Проверить, что пароль существующей базы не изменён
      ansible.builtin.assert:
        that:
          - (previous_db_secret.content | b64decode | trim) == lookup('env', 'POSTGRES_PASSWORD')
        fail_msg: Пароль в GitLab отличается от пароля существующей базы. Требуется отдельная ротация.
      when: existing_db_secret.stat.exists and existing_db_volume.rc == 0
      no_log: true
  tasks:
    - name: Создать каталоги проекта
      ansible.builtin.file:
        path: "{{ project_dir }}/{{ item }}"
        state: directory
        mode: '0755'
      loop: [KikoRiki-quotes, KikoRiki-quotes/frontend, KikoRiki-quotes/backend, KikoRiki-quotes/backend/main, KikoRiki-quotes/backend/notification, deploy]
    - name: Скопировать файлы Compose и инициализации
      ansible.builtin.copy:
        src: "{{ project_source }}/{{ item }}"
        dest: "{{ project_dir }}/{{ item }}"
        mode: '0644'
      loop:
        - KikoRiki-quotes/compose.yaml
        - KikoRiki-quotes/backend/main/Dockerfile
        - KikoRiki-quotes/backend/main/app.py
        - KikoRiki-quotes/backend/main/database.py
        - KikoRiki-quotes/backend/main/requirements.txt
        - KikoRiki-quotes/backend/notification/Dockerfile
        - KikoRiki-quotes/backend/notification/consumer.py
        - KikoRiki-quotes/backend/notification/bot_listener.py
        - KikoRiki-quotes/backend/notification/database.py
        - KikoRiki-quotes/init.sql
        - KikoRiki-quotes/telegram.sql
        - KikoRiki-quotes/nginx.conf
        - KikoRiki-quotes/frontend/index.html
        - KikoRiki-quotes/frontend/style.css
        - KikoRiki-quotes/frontend/script.js
        - KikoRiki-quotes/frontend/cloud-hippo.png
        - smeshariki_quotes.sql
        - deploy/compose.images.yaml
        - deploy/compose.https.yaml
        - deploy/compose.remote-server.yaml
        - deploy/Caddyfile
    - name: Создать каталог секрета базы
      ansible.builtin.file:
        path: "{{ project_dir }}/KikoRiki-quotes/.secrets"
        state: directory
        mode: '0700'
    - name: Записать пароль базы
      ansible.builtin.copy:
        content: "{{ lookup('env', 'POSTGRES_PASSWORD') }}"
        dest: "{{ project_dir }}/KikoRiki-quotes/.secrets/postgres_password"
        mode: '0600'
      no_log: true
    - name: Записать секреты и адреса образов
      ansible.builtin.template:
        src: env.j2
        dest: "{{ project_dir }}/KikoRiki-quotes/.env"
        mode: '0600'
      no_log: true
    - name: Войти в Registry на сервере
      ansible.builtin.command:
        argv: [docker, login, "{{ lookup('env', 'CI_REGISTRY') }}", --username, "{{ lookup('env', 'REGISTRY_DEPLOY_USER') }}", --password-stdin]
        stdin: "{{ lookup('env', 'REGISTRY_DEPLOY_PASSWORD') }}"
      changed_when: false
      no_log: true
    - name: Скачать образы этой версии
      ansible.builtin.command:
        argv: "{{ compose_command + ['pull'] + (['caddy'] if deploy_https == 'true' else []) + ['nginx', 'app', 'db', 'kafka', 'kafka-2', 'kafka-3', 'kafka-init'] }}"
        chdir: "{{ project_dir }}/KikoRiki-quotes"
      changed_when: true
    - name: Остановить обработчики Telegram на сервере
      ansible.builtin.command:
        argv: "{{ compose_command + ['stop', 'notification', 'telegram-bot'] }}"
        chdir: "{{ project_dir }}/KikoRiki-quotes"
      changed_when: false
    - name: Запустить сайт, базу и Kafka
      ansible.builtin.command:
        argv: "{{ compose_command + ['up', '-d', '--no-build', '--remove-orphans', 'caddy' if deploy_https == 'true' else 'nginx'] }}"
        chdir: "{{ project_dir }}/KikoRiki-quotes"
      changed_when: true
    - name: Добавить таблицы привязки в существующую базу
      ansible.builtin.command:
        argv: "{{ compose_command + ['exec', '-T', 'db', 'psql', '-v', 'ON_ERROR_STOP=1', '-U', 'quotes', '-d', 'quotes', '-f', '/docker-entrypoint-initdb.d/03-telegram.sql'] }}"
        chdir: "{{ project_dir }}/KikoRiki-quotes"
      changed_when: false
    - name: Проверить API через Nginx
      ansible.builtin.uri:
        url: http://127.0.0.1:8088/api/smeshariki-quotes
        status_code: 200
      register: api_check
      until: api_check.status | default(0) == 200
      retries: 20
      delay: 3
    - name: Проверить HTTPS и сертификат
      ansible.builtin.uri:
        url: "https://{{ lookup('env', 'SITE_DOMAIN') }}/api/smeshariki-quotes"
        status_code: 200
        validate_certs: true
      register: https_check
      until: https_check.status | default(0) == 200
      retries: 20
      delay: 6
      when: deploy_https == 'true'
