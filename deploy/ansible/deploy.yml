---
- name: Развернуть цитатник на Linux-сервере
  hosts: all
  become: true
  vars:
    project_dir: /opt/smeshariki
    project_source: "{{ playbook_dir }}/../.."
    app_image: "{{ lookup('env', 'CI_REGISTRY_IMAGE') }}/app:{{ lookup('env', 'CI_COMMIT_SHA') }}"
    notification_image: "{{ lookup('env', 'CI_REGISTRY_IMAGE') }}/notification:{{ lookup('env', 'CI_COMMIT_SHA') }}"
  pre_tasks:
    - name: Проверить обязательные настройки
      ansible.builtin.assert:
        that:
          - lookup('env', 'CI_REGISTRY') | length > 0
          - lookup('env', 'CI_REGISTRY_IMAGE') | length > 0
          - lookup('env', 'CI_COMMIT_SHA') | length > 0
          - lookup('env', 'REGISTRY_DEPLOY_USER') | length > 0
          - lookup('env', 'REGISTRY_DEPLOY_PASSWORD') | length > 0
          - lookup('env', 'TELEGRAM_BOT_TOKEN') | length > 0
        fail_msg: Не заданы переменные Registry или Telegram в GitLab CI/CD.
      no_log: true
    - name: Установить Docker и Compose из репозитория Ubuntu
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, python3]
        state: present
        update_cache: true
    - name: Запустить Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
  tasks:
    - name: Создать каталоги проекта
      ansible.builtin.file:
        path: "{{ project_dir }}/{{ item }}"
        state: directory
        mode: '0755'
      loop: [berserk-quotes, berserk-quotes/frontend, berserk-quotes/notification, deploy]
    - name: Скопировать файлы Compose и инициализации
      ansible.builtin.copy:
        src: "{{ project_source }}/{{ item }}"
        dest: "{{ project_dir }}/{{ item }}"
        mode: '0644'
      loop:
        - berserk-quotes/compose.yaml
        - berserk-quotes/Dockerfile
        - berserk-quotes/app.py
        - berserk-quotes/requirements.txt
        - berserk-quotes/notification/Dockerfile
        - berserk-quotes/notification/consumer.py
        - berserk-quotes/notification/bot_listener.py
        - berserk-quotes/init.sql
        - berserk-quotes/telegram.sql
        - berserk-quotes/nginx.conf
        - berserk-quotes/frontend/index.html
        - berserk-quotes/frontend/style.css
        - berserk-quotes/frontend/script.js
        - smeshariki_quotes.sql
        - deploy/compose.images.yaml
    - name: Записать секреты и адреса образов
      ansible.builtin.template:
        src: env.j2
        dest: "{{ project_dir }}/berserk-quotes/.env"
        mode: '0600'
      no_log: true
    - name: Войти в Registry на сервере
      ansible.builtin.command:
        argv: [docker, login, "{{ lookup('env', 'CI_REGISTRY') }}", --username, "{{ lookup('env', 'REGISTRY_DEPLOY_USER') }}", --password-stdin]
        stdin: "{{ lookup('env', 'REGISTRY_DEPLOY_PASSWORD') }}"
      changed_when: false
      no_log: true
    - name: Скачать образы этой версии
      ansible.builtin.command:
        argv: [docker, compose, -f, compose.yaml, -f, ../deploy/compose.images.yaml, pull]
        chdir: "{{ project_dir }}/berserk-quotes"
      changed_when: true
    - name: Запустить сервисы
      ansible.builtin.command:
        argv: [docker, compose, -f, compose.yaml, -f, ../deploy/compose.images.yaml, up, -d, --no-build, --remove-orphans]
        chdir: "{{ project_dir }}/berserk-quotes"
      changed_when: true
    - name: Добавить таблицы привязки в существующую базу
      ansible.builtin.command:
        argv: [docker, compose, -f, compose.yaml, -f, ../deploy/compose.images.yaml, exec, -T, db, psql, -v, ON_ERROR_STOP=1, -U, quotes, -d, quotes, -f, /docker-entrypoint-initdb.d/03-telegram.sql]
        chdir: "{{ project_dir }}/berserk-quotes"
      changed_when: false
    - name: Проверить API через Nginx
      ansible.builtin.uri:
        url: http://127.0.0.1:8088/api/smeshariki-quotes
        status_code: 200
      register: api_check
      until: api_check.status | default(0) == 200
      retries: 20
      delay: 3
