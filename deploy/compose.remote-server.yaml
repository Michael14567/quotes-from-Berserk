# Дополнительные слушатели доступны только на loopback сервера и через SSH-туннель.
services:
  db:
    ports:
      - "127.0.0.1:15432:5432"
  kafka:
    ports:
      - "127.0.0.1:19092:19092"
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,tunnel://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,tunnel://127.0.0.1:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=kafka:33145
  kafka-2:
    ports:
      - "127.0.0.1:29092:29092"
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=1
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,tunnel://0.0.0.0:29092
      - --advertise-kafka-addr=internal://kafka-2:9092,tunnel://127.0.0.1:29092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=kafka-2:33145
      - --seeds=kafka:33145
  kafka-3:
    ports:
      - "127.0.0.1:39092:39092"
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=2
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,tunnel://0.0.0.0:39092
      - --advertise-kafka-addr=internal://kafka-3:9092,tunnel://127.0.0.1:39092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=kafka-3:33145
      - --seeds=kafka:33145
