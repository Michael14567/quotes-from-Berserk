name: kikoriki-notification-local
services:
  ssh-tunnel:
    build: ./ssh-tunnel
    restart: unless-stopped
    ports:
      - "127.0.0.1:18088:18088"
    environment:
      SSH_HOST: ${SERVER_IP:?SERVER_IP is required}
      SSH_USER: ${SERVER_USER:-root}
    secrets:
      - ssh_private_key
      - ssh_known_hosts
    tmpfs:
      - /run/ssh:mode=0700
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 15432 && nc -z 127.0.0.1 19092 && nc -z 127.0.0.1 29092 && nc -z 127.0.0.1 39092"]
      interval: 3s
      timeout: 2s
      retries: 10
  notification:
    build: ../KikoRiki-quotes/backend/notification
    network_mode: service:ssh-tunnel
    restart: unless-stopped
    depends_on:
      ssh-tunnel:
        condition: service_healthy
        restart: true
    environment:
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:19092,127.0.0.1:29092,127.0.0.1:39092
      DB_HOST: 127.0.0.1
      DB_PORT: "15432"
      DB_PASSWORD_FILE: /run/secrets/db_password
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
    secrets:
      - db_password
  telegram-bot:
    build: ../KikoRiki-quotes/backend/notification
    command: ["python", "-u", "bot_listener.py"]
    network_mode: service:ssh-tunnel
    restart: unless-stopped
    depends_on:
      ssh-tunnel:
        condition: service_healthy
        restart: true
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: "15432"
      DB_PASSWORD_FILE: /run/secrets/db_password
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
    secrets:
      - db_password
secrets:
  ssh_private_key:
    file: ../.local/ssh/timeweb_ed25519
  ssh_known_hosts:
    file: ../.local/ssh/timeweb_known_hosts
  db_password:
    file: ../KikoRiki-quotes/.secrets/remote_postgres_password
