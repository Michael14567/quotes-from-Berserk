apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector: {app: app}
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: app}
  template:
    metadata:
      labels: {app: app}
    spec:
      containers:
        - name: app
          image: smeshariki-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - {name: DATABASE_URL, value: "postgresql://quotes:quotes@db:5432/quotes"}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka-0.kafka:9092,kafka-1.kafka:9092,kafka-2.kafka:9092"}
          readinessProbe:
            httpGet: {path: /smeshariki-quotes, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
spec:
  replicas: 0
  selector:
    matchLabels: {app: notification}
  template:
    metadata:
      labels: {app: notification}
    spec:
      containers:
        - name: notification
          image: smeshariki-notification:local
          imagePullPolicy: IfNotPresent
          env:
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka-0.kafka:9092,kafka-1.kafka:9092,kafka-2.kafka:9092"}
            - {name: DATABASE_URL, value: "postgresql://quotes:quotes@db:5432/quotes"}
          envFrom:
            - secretRef:
                name: telegram
                optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bot
spec:
  replicas: 0
  selector:
    matchLabels: {app: telegram-bot}
  template:
    metadata:
      labels: {app: telegram-bot}
    spec:
      containers:
        - name: telegram-bot
          image: smeshariki-notification:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "bot_listener.py"]
          env:
            - {name: DATABASE_URL, value: "postgresql://quotes:quotes@db:5432/quotes"}
          envFrom:
            - secretRef:
                name: telegram
                optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector: {app: frontend}
  ports:
    - {port: 80, targetPort: 80, nodePort: 30080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: nginx
          image: smeshariki-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
      volumes:
        - name: config
          configMap:
            name: nginx-config
