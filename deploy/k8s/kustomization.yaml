apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smeshariki
resources:
  - namespace.yaml
  - postgres.yaml
  - kafka.yaml
  - applications.yaml
configMapGenerator:
  - name: postgres-init
    files:
      - 01-init.sql=../../KikoRiki-quotes/init.sql
      - 02-smeshariki-quotes.sql=../../smeshariki_quotes.sql
      - 03-telegram.sql=../../KikoRiki-quotes/telegram.sql
  - name: nginx-config
    files:
      - default.conf=nginx.conf
generatorOptions:
  disableNameSuffixHash: true
