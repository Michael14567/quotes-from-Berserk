<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Цитаты Смешариков</title>
  <link rel="stylesheet" href="/style.css?v=5">
  <script src="/script.js?v=3" defer></script>
</head>
<body>
  <main class="terminal">
    <div id="clouds" class="clouds" aria-hidden="true" hidden>
      <pre class="cloud cloud-one">    .--.
 .-(    ).
(___.__)__)</pre>
      <pre class="cloud cloud-two">      .--.
   .-(    ).
  (___.__)__)</pre>
      <pre class="cloud cloud-three">    .--.
 .-(    ).
(___.__)__)</pre>
      <svg class="cloud cloud-hippo" viewBox="0 0 220 155" xmlns="http://www.w3.org/2000/svg" focusable="false">
        <path d="M69 35C58 25 47 24 38 28 31 19 19 22 16 31 4 31 1 43 6 54c4 8 14 13 24 15 4 13 12 21 23 26-2 12 4 20 14 21 7 1 12-2 15-7 9 4 19 6 30 6 1 11 8 17 18 16 9-1 13-8 13-17 11-3 21-9 27-17 11 3 18-1 18-8 0-4-3-7-8-8 2-23-10-42-30-50-24-11-58-12-81 4Z" fill="#f5c4d3" stroke="#ffe3eb" stroke-width="4" stroke-linejoin="round"/>
        <path d="M39 43c6 4 13 4 20 0M91 83c-2 11 4 16 12 14m32 5c-2 10 4 14 12 11" fill="none" stroke="#d895aa" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M24 39h.1" stroke="#d895aa" stroke-width="3" stroke-linecap="round"/>
        <path d="M82 35c24-7 54-5 73 5" fill="none" stroke="#fff0f4" stroke-width="5" stroke-linecap="round" opacity=".65"/>
      </svg>
    </div>
    <div class="output" aria-live="polite" aria-atomic="true"><span class="prompt" aria-hidden="true">&gt; </span><span id="quote"></span><span class="cursor" aria-hidden="true"></span></div>
    <div class="actions">
      <button id="next" type="button">Получить цитату <span aria-hidden="true">↵</span></button>
      <button id="admire" type="button" aria-pressed="false">Любоваться облаками</button>
      <button id="telegram" type="button">Привязать Telegram</button>
      <div id="pairing" class="pairing" hidden>
        <img id="qr" alt="QR-код для привязки Telegram" width="200" height="200">
        <p>Отсканируйте QR-код и нажмите Start в боте.</p>
        <a id="bot-link" target="_blank" rel="noopener noreferrer">Открыть бота</a>
        <p id="pairing-status" role="status"></p>
      </div>
    </div>
  </main>
</body>
</html>
